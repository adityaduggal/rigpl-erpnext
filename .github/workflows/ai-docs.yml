name: AI docs

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check AGENTS.md and SKILL.md size caps
        run: python3 scripts/ai-docs-lint.py
