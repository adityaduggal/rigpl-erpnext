<div class="rigpl-contact-strip text-center">
	{%- if title -%}
	<h5>{{ title | e }}</h5>
	{%- endif -%}
	{%- if email -%}
	<p>Email: <a class="text-underline text-dark" href="mailto:{{ email | e }}">{{ email | e }}</a></p>
	{%- endif -%}
	{%- if phone -%}
	<p>Phone: <a class="text-underline text-dark" href="tel:{{ phone | replace(' ', '') | e }}">{{ phone | e }}</a></p>
	{%- endif -%}
	{%- if cta_label and cta_url -%}
	<p><a class="btn btn-primary mt-2" href="{{ cta_url | e }}">{{ cta_label | e }}</a></p>
	{%- endif -%}
</div>
